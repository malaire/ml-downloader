[package]
name = "ml-downloader"
version = "0.2.0"
license = "MIT"
description = "Simple blocking downloader based on reqwest"
repository = "https://github.com/malaire/ml-downloader"
keywords = [ "client", "download", "http", "https", "request" ]
categories = [ "web-programming::http-client" ]
edition = "2021"
# uses `Path::with_added_extension`
rust-version = "1.91"

include = [
    "/src",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "build.rs",
]

[dependencies]
bytes = "1.11.1"
digest = "0.11.3"
fastrand = "2.4.1"
hex = "0.4.3"
httpdate = "1.0.3"
reqwest = { version = "0.13.3", features = [ "blocking" ] }

[dev-dependencies]
# used in `RequestBuilder::verify_hash` example
sha2 = "0.11.0"

[build-dependencies]
readme-rustdocifier = "0.1.1"
